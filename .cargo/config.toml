# Tarqeem project configuration
# This file configures Cargo settings for the project

[build]
# Use all available CPU cores for parallel compilation
jobs = -1

[alias]
# Common development commands
lint = "clippy --all-targets --all-features"
check-all = "check --all-targets --all-features"
test-all = "test --all-features"

[env]
# Default to release mode for benchmarks
CARGO_PROFILE_BENCH_OPT_LEVEL = "3"
