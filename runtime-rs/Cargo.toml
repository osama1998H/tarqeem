[package]
name = "tarqeem-runtime"
version = "1.0.0"
edition = "2021"
authors = ["Tarqeem Contributors"]
description = "Tarqeem runtime library - مكتبة وقت التشغيل لترقيم"
license = "MIT"
repository = "https://github.com/osama1998H/tarqeem"
keywords = ["runtime", "ffi", "arabic", "tarqeem"]

[lib]
name = "trq"
crate-type = ["staticlib", "cdylib"]

[dependencies]
libc = "0.2"

[dev-dependencies]
# Tests can be added later

[features]
default = ["std"]
std = []

# Linting configuration
[lints.rust]
# Allow unsafe code - required for FFI
unsafe_code = "allow"
