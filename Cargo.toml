[package]
name = "tarqeem"
version = "0.1.0"
edition = "2021"
authors = ["Tarqeem Contributors"]
description = "أول لغة برمجة عربية مُترجَمة للأغراض العامة - The first compiled Arabic programming language"
license = "MIT"
repository = "https://github.com/osama1998H/tarqeem"
keywords = ["compiler", "programming-language", "arabic", "compiler-design"]
categories = ["compilers", "development-tools"]

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }
colored = "2.2"

# Unicode handling
unicode-segmentation = "1.12"
unicode-normalization = "0.1"

# Utilities
indexmap = "2.12"
phf = { version = "0.11", features = ["macros"] }

# Serialization (for package manager)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Package management
semver = "1.0"
sha2 = "0.10"
hex = "0.4"
flate2 = "1.0"
tar = "0.4"
dirs = "5.0"
walkdir = "2.5"

# Error handling
thiserror = "1.0"

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.14"

[[bin]]
name = "tarqeem"
path = "src/main.rs"

[lib]
name = "tarqeem"
path = "src/lib.rs"

[profile.release]
lto = true
codegen-units = 1
