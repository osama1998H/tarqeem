<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e94560;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bg)" stroke="#e94560" stroke-width="3"/>

  <!-- Arabic letter ت (Ta) stylized -->
  <g fill="#e94560">
    <!-- Main body of ت -->
    <path d="M30 75 Q30 55 50 55 L78 55 Q98 55 98 75 L98 80 Q98 85 93 85 L35 85 Q30 85 30 80 Z"
          fill="none" stroke="#e94560" stroke-width="4" stroke-linecap="round"/>

    <!-- Two dots above -->
    <circle cx="54" cy="42" r="5"/>
    <circle cx="74" cy="42" r="5"/>
  </g>

  <!-- Code brackets decoration -->
  <g fill="none" stroke="#0f3460" stroke-width="3" stroke-linecap="round">
    <!-- Left bracket -->
    <path d="M20 40 L15 64 L20 88"/>
    <!-- Right bracket -->
    <path d="M108 40 L113 64 L108 88"/>
  </g>

  <!-- Small decorative elements -->
  <circle cx="64" cy="100" r="3" fill="#e94560" opacity="0.7"/>
</svg>
