name: Examples

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================
  # Build Tarqeem Compiler
  # ============================================
  build-compiler:
    name: Build Compiler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --verbose

      - name: Upload compiler binary
        uses: actions/upload-artifact@v4
        with:
          name: tarqeem-compiler
          path: target/release/tarqeem

  # ============================================
  # Validate Examples (Syntax Check)
  # ============================================
  check-examples:
    name: Check Examples Syntax
    runs-on: ubuntu-latest
    needs: build-compiler
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Download compiler
        uses: actions/download-artifact@v4
        with:
          name: tarqeem-compiler
          path: ./bin

      - name: Make compiler executable
        run: chmod +x ./bin/tarqeem

      - name: Check all example files
        run: |
          echo "## Syntax Check Results" > check-results.md
          echo "" >> check-results.md

          PASS=0
          FAIL=0

          for file in examples/*.ترقيم examples/*.trq; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              echo "Checking: $filename"

              if ./bin/tarqeem check "$file" 2>&1; then
                echo "- :white_check_mark: $filename" >> check-results.md
                PASS=$((PASS + 1))
              else
                echo "- :x: $filename" >> check-results.md
                FAIL=$((FAIL + 1))
              fi
            fi
          done

          echo "" >> check-results.md
          echo "**Passed:** $PASS | **Failed:** $FAIL" >> check-results.md

          cat check-results.md

          if [ $FAIL -gt 0 ]; then
            echo "Some examples failed syntax check ($FAIL failed, $PASS passed)"
            # Don't fail the workflow, just report
          fi

      - name: Upload check results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: syntax-check-results
          path: check-results.md

  # ============================================
  # Run Examples (Individual Jobs)
  # ============================================
  run-examples:
    name: Run Examples
    runs-on: ubuntu-latest
    needs: build-compiler
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        example:
          - مرحبا
          - متغيرات
          - دوال
          - تحكم
          - أهلا
          - بصمة
          - صنف
          - خواص
          - اختبار_بسيط
          - اختبار_مجموعات
          - تعداد
          - ضغط
          - لعبة_الحياة_بسيط
          - لعبة_الحياة
    steps:
      - uses: actions/checkout@v4

      - name: Download compiler
        uses: actions/download-artifact@v4
        with:
          name: tarqeem-compiler
          path: ./bin

      - name: Make compiler executable
        run: chmod +x ./bin/tarqeem

      - name: Run example - ${{ matrix.example }}
        run: |
          # Try both extensions
          if [ -f "examples/${{ matrix.example }}.ترقيم" ]; then
            FILE="examples/${{ matrix.example }}.ترقيم"
          elif [ -f "examples/${{ matrix.example }}.trq" ]; then
            FILE="examples/${{ matrix.example }}.trq"
          else
            echo "Example file not found: ${{ matrix.example }}"
            echo "Available files:"
            ls -la examples/ || true
            exit 0  # Don't fail if file not found
          fi

          echo "Running: $FILE"
          echo "================================"

          # Run with timeout (30 seconds max)
          timeout 30s ./bin/tarqeem run "$FILE" 2>&1 || {
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 124 ]; then
              echo "Example timed out after 30 seconds"
            else
              echo "Example completed with exit code: $EXIT_CODE"
            fi
          }
          echo "Example execution completed"

  # ============================================
  # Run Standard Library Tests
  # ============================================
  run-stdlib:
    name: Run Standard Library Tests
    runs-on: ubuntu-latest
    needs: build-compiler
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Download compiler
        uses: actions/download-artifact@v4
        with:
          name: tarqeem-compiler
          path: ./bin

      - name: Make compiler executable
        run: chmod +x ./bin/tarqeem

      - name: Run stdlib tests
        run: |
          echo "## Standard Library Test Results" > stdlib-results.md
          echo "" >> stdlib-results.md

          # Run stdlib test file if it exists
          if [ -f "tests/stdlib_test.ترقيم" ]; then
            echo "Running stdlib tests..."
            if ./bin/tarqeem run "tests/stdlib_test.ترقيم" 2>&1; then
              echo ":white_check_mark: stdlib tests passed" >> stdlib-results.md
            else
              echo ":warning: stdlib tests had issues" >> stdlib-results.md
            fi
          else
            echo "No stdlib test file found" >> stdlib-results.md
          fi

          cat stdlib-results.md

      - name: Upload stdlib results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stdlib-test-results
          path: stdlib-results.md

  # ============================================
  # Compile Examples (Generate Artifacts)
  # ============================================
  compile-examples:
    name: Compile Examples
    runs-on: ubuntu-latest
    needs: build-compiler
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Download compiler
        uses: actions/download-artifact@v4
        with:
          name: tarqeem-compiler
          path: ./bin

      - name: Make compiler executable
        run: chmod +x ./bin/tarqeem

      - name: Compile all examples
        run: |
          mkdir -p compiled

          echo "## Compilation Results" > compile-results.md
          echo "" >> compile-results.md
          echo "| Example | Status | Size |" >> compile-results.md
          echo "|---------|--------|------|" >> compile-results.md

          for file in examples/*.ترقيم examples/*.trq; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              name="${filename%.*}"

              echo "Compiling: $filename"

              if ./bin/tarqeem compile "$file" -o "compiled/$name" 2>&1; then
                if [ -f "compiled/$name" ]; then
                  SIZE=$(du -h "compiled/$name" | cut -f1)
                  echo "| $filename | :white_check_mark: | $SIZE |" >> compile-results.md
                else
                  echo "| $filename | :warning: No output | - |" >> compile-results.md
                fi
              else
                echo "| $filename | :x: Failed | - |" >> compile-results.md
              fi
            fi
          done

          cat compile-results.md

      - name: Upload compilation results
        uses: actions/upload-artifact@v4
        with:
          name: compile-results
          path: |
            compile-results.md
            compiled/

  # ============================================
  # Example Summary
  # ============================================
  summary:
    name: Examples Summary
    runs-on: ubuntu-latest
    needs: [check-examples, run-examples, compile-examples]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate summary
        run: |
          echo "# Tarqeem Examples Summary" > summary.md
          echo "" >> summary.md
          echo "## Results" >> summary.md
          echo "" >> summary.md

          # Combine all results
          if [ -f "artifacts/syntax-check-results/check-results.md" ]; then
            echo "### Syntax Check" >> summary.md
            cat "artifacts/syntax-check-results/check-results.md" >> summary.md
            echo "" >> summary.md
          fi

          if [ -f "artifacts/compile-results/compile-results.md" ]; then
            echo "### Compilation" >> summary.md
            cat "artifacts/compile-results/compile-results.md" >> summary.md
            echo "" >> summary.md
          fi

          cat summary.md

      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: examples-summary
          path: summary.md
