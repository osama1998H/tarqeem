name: Examples

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================
  # Build Tarqeem Compiler and Runtime
  # ============================================
  build-compiler:
    name: Build Compiler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release (compiler + runtime)
        run: cargo build --release --workspace --verbose

      - name: Verify runtime library
        run: |
          ls -la target/release/libtrq.a
          file target/release/libtrq.a

      - name: Upload compiler binary
        uses: actions/upload-artifact@v7
        with:
          name: tarqeem-compiler
          path: target/release/tarqeem

      - name: Upload runtime library
        uses: actions/upload-artifact@v7
        with:
          name: tarqeem-runtime
          path: target/release/libtrq.a

  # ============================================
  # Validate Examples (Syntax Check)
  # ============================================
  check-examples:
    name: Check Examples Syntax
    runs-on: ubuntu-latest
    needs: build-compiler
    steps:
      - uses: actions/checkout@v7

      - name: Download compiler
        uses: actions/download-artifact@v8
        with:
          name: tarqeem-compiler
          path: ./bin

      - name: Make compiler executable
        run: chmod +x ./bin/tarqeem

      - name: Check all example files
        run: |
          echo "## Syntax Check Results" > check-results.md
          echo "" >> check-results.md

          PASS=0
          FAIL=0

          # examples/ is flat, so this glob is the whole corpus. It is not
          # recursive on purpose: a nested example would be checked here but
          # missed by the run-* matrices below, which resolve examples/<name>.ترقيم.
          for file in examples/*.ترقيم; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              echo "Checking: $filename"

              if ./bin/tarqeem check "$file" 2>&1; then
                echo "- :white_check_mark: $filename" >> check-results.md
                PASS=$((PASS + 1))
              else
                echo "- :x: $filename" >> check-results.md
                FAIL=$((FAIL + 1))
              fi
            fi
          done

          echo "" >> check-results.md
          echo "**Passed:** $PASS | **Failed:** $FAIL" >> check-results.md

          cat check-results.md

          if [ $FAIL -gt 0 ]; then
            echo "::error::Some examples failed syntax check ($FAIL failed, $PASS passed)"
            exit 1
          fi

      - name: Upload check results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: syntax-check-results
          path: check-results.md

  # ============================================
  # Validate the Standard Library (Syntax Check)
  # ============================================
  check-stdlib:
    name: Check Stdlib Syntax
    runs-on: ubuntu-latest
    needs: build-compiler
    steps:
      - uses: actions/checkout@v7

      - name: Download compiler
        uses: actions/download-artifact@v8
        with:
          name: tarqeem-compiler
          path: ./bin

      - name: Make compiler executable
        run: chmod +x ./bin/tarqeem

      # 33 of 43 stdlib files did not parse before #228 and nothing noticed,
      # because the only stdlib parse coverage was two hard-coded files. The
      # allowlist mirrors KNOWN_UNPARSEABLE in tests/integration_tests.rs and may
      # only shrink.
      - name: Parse every stdlib file
        run: |
          ALLOWED="stdlib/أخطاء/فهرس.ترقيم"   # #243
          PASS=0
          FAIL=0

          while IFS= read -r file; do
            if ./bin/tarqeem parse "$file" >/dev/null 2>&1; then
              PASS=$((PASS + 1))
              if [ "$file" = "$ALLOWED" ]; then
                echo "::error::$file parses now — drop it from the allowlist here and in tests/integration_tests.rs"
                exit 1
              fi
            elif [ "$file" = "$ALLOWED" ]; then
              echo "known blocker (#243): $file"
            else
              echo "::error::$file no longer parses"
              ./bin/tarqeem parse "$file" 2>&1 | head -12
              FAIL=$((FAIL + 1))
            fi
          done < <(find stdlib -name '*.ترقيم' | sort)

          echo "**Parsed:** $PASS | **Failed:** $FAIL"

          if [ $FAIL -gt 0 ]; then
            exit 1
          fi

  # ============================================
  # Run Examples with Interpreter (Default Mode)
  # ============================================
  run-examples-interpreted:
    name: Run Examples (Interpreter)
    runs-on: ubuntu-latest
    needs: build-compiler
    strategy:
      fail-fast: false
      matrix:
        example:
          # Every file in examples/. Kept in sync by hand — an example added
          # without an entry here is silently never run.
          - مرحبا
          - متغيرات
          - دوال
          - تحكم
          - أهلا
          - صنف
          - خواص
          - وراثة
          - رؤية_بسيط
          - تعداد
          - اختبار_بسيط
          - اختبار_مجموعات
          - اختبار_اطار_العمل
          - لعبة_الحياة_بسيط
          - لعبة_الحياة
          - حاسبة
          - وضع_البرنامج
          - بصمة
          - ضغط
          - دوال_سهمية
          - أسطر_متعددة
    steps:
      - uses: actions/checkout@v7

      - name: Download compiler
        uses: actions/download-artifact@v8
        with:
          name: tarqeem-compiler
          path: ./bin

      - name: Make compiler executable
        run: chmod +x ./bin/tarqeem

      - name: Run example (Interpreter) - ${{ matrix.example }}
        run: |
          # Try both extensions
          if [ -f "examples/${{ matrix.example }}.ترقيم" ]; then
            FILE="examples/${{ matrix.example }}.ترقيم"
          else
            echo "::error::Example file not found: ${{ matrix.example }}"
            exit 1
          fi

          echo "Running with Interpreter: $FILE"
          echo "================================"

          # Run with timeout (30 seconds max) - uses interpreter by default
          timeout 30s ./bin/tarqeem run "$FILE"

  # ============================================
  # Run Examples with JIT Compilation
  # ============================================
  run-examples-jit:
    name: Run Examples (JIT)
    runs-on: ubuntu-latest
    needs: build-compiler
    strategy:
      fail-fast: false
      matrix:
        example:
          # Every file in examples/. Kept in sync by hand — an example added
          # without an entry here is silently never run.
          - مرحبا
          - متغيرات
          - دوال
          - تحكم
          - أهلا
          - صنف
          - خواص
          - وراثة
          - رؤية_بسيط
          - تعداد
          - اختبار_بسيط
          - اختبار_مجموعات
          - اختبار_اطار_العمل
          - لعبة_الحياة_بسيط
          - لعبة_الحياة
          - حاسبة
          - وضع_البرنامج
          - بصمة
          - ضغط
          - دوال_سهمية
          - أسطر_متعددة
    steps:
      - uses: actions/checkout@v7

      - name: Download compiler
        uses: actions/download-artifact@v8
        with:
          name: tarqeem-compiler
          path: ./bin

      - name: Make compiler executable
        run: chmod +x ./bin/tarqeem

      - name: Run example with JIT - ${{ matrix.example }}
        run: |
          # Try both extensions
          if [ -f "examples/${{ matrix.example }}.ترقيم" ]; then
            FILE="examples/${{ matrix.example }}.ترقيم"
          else
            echo "::error::Example file not found: ${{ matrix.example }}"
            exit 1
          fi

          echo "Running with JIT: $FILE"
          echo "================================"

          # Run with JIT compilation and timeout (30 seconds max)
          timeout 30s ./bin/tarqeem run --jit "$FILE"

  # ============================================
  # Run Examples with Full Compilation (AOT)
  # ============================================
  run-examples-compiled:
    name: Run Examples (Compiled)
    runs-on: ubuntu-latest
    needs: build-compiler
    strategy:
      fail-fast: false
      matrix:
        example:
          # Every file in examples/. Kept in sync by hand — an example added
          # without an entry here is silently never run.
          - مرحبا
          - متغيرات
          - دوال
          - تحكم
          - أهلا
          - صنف
          - خواص
          - وراثة
          - رؤية_بسيط
          - تعداد
          - اختبار_بسيط
          - اختبار_مجموعات
          - اختبار_اطار_العمل
          - لعبة_الحياة_بسيط
          - لعبة_الحياة
          - حاسبة
          - وضع_البرنامج
          - بصمة
          - ضغط
          - دوال_سهمية
          - أسطر_متعددة
    steps:
      - uses: actions/checkout@v7

      - name: Install LLVM/Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld zlib1g-dev

      - name: Download compiler
        uses: actions/download-artifact@v8
        with:
          name: tarqeem-compiler
          path: ./bin

      - name: Download runtime library
        uses: actions/download-artifact@v8
        with:
          name: tarqeem-runtime
          path: ./runtime

      - name: Make compiler executable
        run: chmod +x ./bin/tarqeem

      - name: Verify runtime library
        run: |
          ls -la ./runtime/
          file ./runtime/libtrq.a

      - name: Compile and run example - ${{ matrix.example }}
        run: |
          # Try both extensions
          if [ -f "examples/${{ matrix.example }}.ترقيم" ]; then
            FILE="examples/${{ matrix.example }}.ترقيم"
          else
            echo "::error::Example file not found: ${{ matrix.example }}"
            exit 1
          fi

          echo "Compiling: $FILE"
          echo "================================"

          # Compile to native binary
          ./bin/tarqeem compile "$FILE" -o "./output_${{ matrix.example }}"

          echo ""
          echo "Running compiled binary:"
          echo "================================"

          # Run the compiled binary with timeout (30 seconds max)
          timeout 30s "./output_${{ matrix.example }}"

  # ============================================
  # Compare Interpreter vs Native Output
  # ============================================
  # The jobs above run every example under all three backends, but only ever
  # check the exit code. A miscompilation that prints wrong numbers and exits 0
  # passes them all — which is exactly how issue #239 (auto-property accessors
  # all addressing field slot 0) survived in `خواص` while CI stayed green.
  #
  # This job takes the interpreter as the reference and diffs both other
  # backends' stdout against it, so a backend that silently disagrees fails the
  # build. It also asserts each run's exit status, because two backends that are
  # both broken enough to print nothing would otherwise produce two empty files
  # and "agree".
  compare-backends:
    name: Compare Backends (Interpreter vs JIT vs Native)
    runs-on: ubuntu-latest
    needs: build-compiler
    steps:
      - uses: actions/checkout@v7

      - name: Install LLVM/Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld zlib1g-dev

      - name: Download compiler
        uses: actions/download-artifact@v8
        with:
          name: tarqeem-compiler
          path: ./bin

      - name: Download runtime library
        uses: actions/download-artifact@v8
        with:
          name: tarqeem-runtime
          path: ./runtime

      - name: Make compiler executable
        run: chmod +x ./bin/tarqeem

      - name: Diff every backend's output against the interpreter's
        env:
          # `example:backend` pairs known to disagree with the interpreter, with
          # the issue that tracks each. Entries are removed as the issues are
          # fixed — never added to silence a fresh divergence without filing one
          # first. Keyed per backend, not per example, because a bug is usually
          # specific to one: ضغط agrees under the JIT and differs only natively,
          # so a per-example entry would wrongly excuse a future JIT regression.
          #
          #   ضغط:native — #185: native طول counts UTF-8 bytes where the
          #                interpreter counts characters, so every length differs.
          KNOWN_DIVERGENT: "ضغط:native"
          # Examples native codegen is *documented* to refuse, so a refusal here
          # is the expected outcome rather than a build break. KNOWN_DIVERGENT
          # cannot cover these: it is only consulted once a binary exists.
          #
          #   (none today — an example using ارمِ would belong here, since
          #    native compilation rejects it with ت٠٣٠٣ by design, see #238.)
          NATIVE_UNSUPPORTED: ""
        run: |
          # `find_runtime`'s first priority, and the only one that resolves in a
          # job that downloads the library as an artifact rather than building
          # it: no target/ directory, no CARGO_MANIFEST_DIR, no ~/.tarqeem.
          export TARQEEM_RUNTIME_PATH="$PWD/runtime/libtrq.a"
          # TARQEEM_HOME is deliberately left unset (not set to ""), so the
          # stdlib search falls through to this checkout's own stdlib.
          unset TARQEEM_HOME
          mkdir -p ./compare
          status=0

          # Is $1 listed in the space-separated allowlist $2?
          listed() {
            case " $2 " in (*" $1 "*) return 0 ;; esac
            return 1
          }

          for file in examples/*.ترقيم; do
            name="$(basename "$file" .ترقيم)"
            reference="./compare/${name}.interpreted"

            # An example that cannot run under the interpreter has no reference
            # to compare against, and an empty file is not one — that is how two
            # equally broken backends would "agree".
            if ! timeout 30s ./bin/tarqeem run "$file" > "$reference" 2> "./compare/${name}.run.log"; then
              echo "::error file=$file::فشل التنفيذ بالمفسّر / interpreter run failed"
              tail -20 "./compare/${name}.run.log"
              status=1
              continue
            fi

            for backend in jit native; do
              actual="./compare/${name}.${backend}"

              case "$backend" in
                jit)
                  if ! timeout 60s ./bin/tarqeem run --jit "$file" > "$actual" 2> "./compare/${name}.jit.log"; then
                    echo "::error file=$file::فشل التنفيذ بالترجمة الفورية / JIT run failed"
                    tail -20 "./compare/${name}.jit.log"
                    status=1
                    continue
                  fi
                  ;;
                native)
                  if ! timeout 120s ./bin/tarqeem compile "$file" -o "./compare/${name}.bin" \
                       > "./compare/${name}.compile.log" 2>&1; then
                    if listed "$name" "$NATIVE_UNSUPPORTED"; then
                      echo "known     $name (الترجمة الأصلية غير مدعومة / native unsupported)"
                    else
                      echo "::error file=$file::تعذّرت الترجمة الأصلية / native compile failed"
                      tail -20 "./compare/${name}.compile.log"
                      status=1
                    fi
                    continue
                  fi
                  if listed "$name" "$NATIVE_UNSUPPORTED"; then
                    echo "::error file=$file::$name يُترجَم الآن — أزله من NATIVE_UNSUPPORTED / compiles now, remove it from NATIVE_UNSUPPORTED"
                    status=1
                  fi
                  if ! timeout 30s "./compare/${name}.bin" > "$actual" 2> "./compare/${name}.native.log"; then
                    echo "::error file=$file::فشل تنفيذ الملف التنفيذي الأصلي / native binary run failed"
                    tail -20 "./compare/${name}.native.log"
                    status=1
                    continue
                  fi
                  ;;
              esac

              if diff -u "$reference" "$actual" > "./compare/${name}.${backend}.diff"; then
                echo "ok        $name ($backend)"
                # A known-divergent example that has started agreeing means the
                # tracking issue is fixed; drop it from KNOWN_DIVERGENT.
                if listed "$name:$backend" "$KNOWN_DIVERGENT"; then
                  echo "::error file=$file::$name متطابق الآن ($backend) — أزل $name:$backend من KNOWN_DIVERGENT / now agrees, remove it from KNOWN_DIVERGENT"
                  status=1
                fi
              elif listed "$name:$backend" "$KNOWN_DIVERGENT"; then
                echo "known     $name ($backend) (اختلاف متوقع / expected divergence)"
              else
                echo "::error file=$file::$name يطبع خرجاً مختلفاً بين المفسّر و$backend / output differs from the interpreter"
                cat "./compare/${name}.${backend}.diff"
                status=1
              fi
            done
          done

          exit $status

  # ============================================
  # Run Standard Library Tests
  # ============================================
  run-stdlib:
    name: Run Standard Library Tests
    runs-on: ubuntu-latest
    needs: build-compiler
    steps:
      - uses: actions/checkout@v7

      - name: Download compiler
        uses: actions/download-artifact@v8
        with:
          name: tarqeem-compiler
          path: ./bin

      - name: Make compiler executable
        run: chmod +x ./bin/tarqeem

      - name: Run stdlib tests
        run: |
          echo "## Standard Library Test Results" > stdlib-results.md
          echo "" >> stdlib-results.md

          # Run stdlib test file if it exists
          if [ -f "tests/stdlib_test.ترقيم" ]; then
            echo "Running stdlib tests..."
            ./bin/tarqeem run "tests/stdlib_test.ترقيم"
            echo ":white_check_mark: stdlib tests passed" >> stdlib-results.md
          else
            echo "No stdlib test file found, skipping" >> stdlib-results.md
          fi

          cat stdlib-results.md

      - name: Upload stdlib results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stdlib-test-results
          path: stdlib-results.md

  # ============================================
  # Example Summary
  # ============================================
  summary:
    name: Examples Summary
    runs-on: ubuntu-latest
    needs: [check-examples, check-stdlib, run-examples-interpreted, run-examples-jit, run-examples-compiled, run-stdlib]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate summary
        run: |
          echo "# Tarqeem Examples Summary" > summary.md
          echo "" >> summary.md
          echo "## Results" >> summary.md
          echo "" >> summary.md

          # Combine all results
          if [ -f "artifacts/syntax-check-results/check-results.md" ]; then
            echo "### Syntax Check" >> summary.md
            cat "artifacts/syntax-check-results/check-results.md" >> summary.md
            echo "" >> summary.md
          fi

          if [ -f "artifacts/stdlib-test-results/stdlib-results.md" ]; then
            echo "### Standard Library Tests" >> summary.md
            cat "artifacts/stdlib-test-results/stdlib-results.md" >> summary.md
            echo "" >> summary.md
          fi

          cat summary.md

      - name: Upload summary
        uses: actions/upload-artifact@v7
        with:
          name: examples-summary
          path: summary.md
