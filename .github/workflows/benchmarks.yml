name: Benchmarks

on:
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================
  # Run Benchmarks and Compare
  # ============================================
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install critcmp
        run: cargo install critcmp

      - name: Run benchmarks on PR branch
        id: bench_pr
        run: |
          set -o pipefail  # Make pipeline fail if any command fails
          echo "Running benchmarks on PR branch..."
          mkdir -p benchmark-results
          # Use --benches to only run Criterion benchmarks, not library tests
          # (library tests don't understand --save-baseline option)
          if cargo bench --benches -- --save-baseline pr 2>&1 | tee benchmark-pr.log; then
            echo "pr_success=true" >> $GITHUB_OUTPUT
            if [ -d "target/criterion" ]; then
              cp -r target/criterion benchmark-results/pr
            fi
          else
            echo "pr_success=false" >> $GITHUB_OUTPUT
            echo "::warning::PR branch benchmarks failed. Check benchmark-pr.log for details."
          fi

      - name: Checkout base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.base_ref }}
          clean: false

      - name: Run benchmarks on base branch
        id: bench_base
        continue-on-error: true  # Base branch may not have benchmarks or may have different structure
        run: |
          set -o pipefail  # Make pipeline fail if any command fails
          echo "Running benchmarks on base branch (${{ github.base_ref }})..."
          # Check if benchmarks exist in base branch
          if [ ! -f "Cargo.toml" ] || ! grep -q '\[\[bench\]\]' Cargo.toml 2>/dev/null; then
            echo "base_success=false" >> $GITHUB_OUTPUT
            echo "base_reason=no_benchmarks" >> $GITHUB_OUTPUT
            echo "::notice::Base branch does not have benchmark configuration"
            exit 0
          fi

          # Use --benches to only run Criterion benchmarks, not library tests
          if cargo bench --benches -- --save-baseline base 2>&1 | tee benchmark-base.log; then
            echo "base_success=true" >> $GITHUB_OUTPUT
            if [ -d "target/criterion" ]; then
              cp -r target/criterion benchmark-results/base
            fi
          else
            echo "base_success=false" >> $GITHUB_OUTPUT
            echo "base_reason=failed" >> $GITHUB_OUTPUT
            echo "::warning::Base branch benchmarks failed. Check benchmark-base.log for details."
          fi

      - name: Checkout PR branch again
        uses: actions/checkout@v6
        with:
          clean: false

      - name: Compare benchmarks
        id: compare
        run: |
          echo "## Benchmark Results" > benchmark-report.md
          echo "" >> benchmark-report.md
          echo "Comparing **${{ github.head_ref }}** against **${{ github.base_ref }}**" >> benchmark-report.md
          echo "" >> benchmark-report.md

          # Debug: Show what exists in target/criterion
          echo "### Debug Info" >> benchmark-report.md
          echo "" >> benchmark-report.md
          if [ -d "target/criterion" ]; then
            echo "Criterion directory contents:" >> benchmark-report.md
            echo "\`\`\`" >> benchmark-report.md
            ls -la target/criterion/ 2>&1 | head -20 >> benchmark-report.md
            echo "\`\`\`" >> benchmark-report.md
          else
            echo "⚠️ target/criterion directory does not exist" >> benchmark-report.md
          fi
          echo "" >> benchmark-report.md

          # Check if we have both baselines by looking in target/criterion (where critcmp reads from)
          PR_BASELINE_EXISTS=false
          BASE_BASELINE_EXISTS=false

          # Look for any benchmark group with pr/base subdirectories
          if [ -d "target/criterion" ]; then
            for dir in target/criterion/*/; do
              if [ -d "${dir}pr" ]; then
                PR_BASELINE_EXISTS=true
              fi
              if [ -d "${dir}base" ]; then
                BASE_BASELINE_EXISTS=true
              fi
            done
          fi

          if [ "$PR_BASELINE_EXISTS" = "true" ] && [ "$BASE_BASELINE_EXISTS" = "true" ]; then
            # Run critcmp and capture output
            echo "Running critcmp comparison..." >> benchmark-report.md
            if critcmp base pr --color never > critcmp-output.txt 2>&1; then
              echo "Comparison successful" >> benchmark-report.md
            else
              echo "critcmp comparison had issues, output may be incomplete" >> benchmark-report.md
            fi
          elif [ "$PR_BASELINE_EXISTS" = "true" ]; then
            echo "Baseline comparison not available (base branch '${{ github.base_ref }}' has no benchmarks or they failed)" > critcmp-output.txt
          elif [ "$BASE_BASELINE_EXISTS" = "true" ]; then
            echo "PR benchmarks failed - cannot compare" > critcmp-output.txt
          else
            echo "No benchmark baselines found. Both PR and base branch benchmarks may have failed." > critcmp-output.txt
            echo "" >> critcmp-output.txt
            echo "PR benchmark status: ${{ steps.bench_pr.outputs.pr_success || 'unknown' }}" >> critcmp-output.txt
            echo "Base benchmark status: ${{ steps.bench_base.outputs.base_success || 'unknown' }}" >> critcmp-output.txt
          fi

          # Parse and format results
          echo "### Summary" >> benchmark-report.md
          echo "" >> benchmark-report.md
          echo "\`\`\`" >> benchmark-report.md
          cat critcmp-output.txt >> benchmark-report.md
          echo "\`\`\`" >> benchmark-report.md
          echo "" >> benchmark-report.md

          # Check for regressions (>5% slower)
          if grep -E '\+[5-9][0-9]*\.[0-9]+%|\+[0-9]{3,}\.[0-9]+%' critcmp-output.txt > /dev/null 2>&1; then
            echo "### :warning: Performance Regressions Detected" >> benchmark-report.md
            echo "" >> benchmark-report.md
            echo "Some benchmarks show >5% regression. Please review the changes." >> benchmark-report.md
            echo "regression=true" >> $GITHUB_OUTPUT
          else
            echo "### :white_check_mark: No Significant Regressions" >> benchmark-report.md
            echo "" >> benchmark-report.md
            echo "All benchmarks are within acceptable performance ranges." >> benchmark-report.md
            echo "regression=false" >> $GITHUB_OUTPUT
          fi

          echo "" >> benchmark-report.md
          echo "---" >> benchmark-report.md
          echo "" >> benchmark-report.md
          echo "### Benchmark Groups" >> benchmark-report.md
          echo "" >> benchmark-report.md

          # List which benchmark groups were run
          FOUND_BENCHMARKS=""
          for bench in lexer parser semantic ir_generation optimizer end_to_end jit; do
            if [ -d "target/criterion" ]; then
              # Check for any benchmark group that starts with this name
              if ls -d target/criterion/${bench}* 2>/dev/null | head -1 | grep -q .; then
                FOUND_BENCHMARKS="$FOUND_BENCHMARKS $bench"
              fi
            fi
          done

          if [ -n "$FOUND_BENCHMARKS" ]; then
            echo "**Executed benchmark groups:**$FOUND_BENCHMARKS" >> benchmark-report.md
            echo "" >> benchmark-report.md
            echo "See critcmp output above for detailed comparison results." >> benchmark-report.md
          else
            echo "No benchmark groups found." >> benchmark-report.md
            echo "" >> benchmark-report.md
            # Add helpful debugging information
            if [ -f "benchmark-pr.log" ]; then
              echo "**PR Benchmark Log (last 20 lines):**" >> benchmark-report.md
              echo "\`\`\`" >> benchmark-report.md
              tail -20 benchmark-pr.log >> benchmark-report.md
              echo "\`\`\`" >> benchmark-report.md
            fi
            if [ -f "benchmark-base.log" ]; then
              echo "**Base Benchmark Log (last 20 lines):**" >> benchmark-report.md
              echo "\`\`\`" >> benchmark-report.md
              tail -20 benchmark-base.log >> benchmark-report.md
              echo "\`\`\`" >> benchmark-report.md
            fi
          fi

      - name: Post benchmark results as PR comment
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('benchmark-report.md', 'utf8');

            // Find existing benchmark comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('## Benchmark Results')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: report
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: report
              });
            }

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-results
          path: |
            benchmark-results/
            benchmark-report.md
            benchmark-pr.log
            benchmark-base.log
            critcmp-output.txt
          if-no-files-found: ignore

  # ============================================
  # Individual Benchmark Jobs (Detailed)
  # These are optional informational jobs that provide granular benchmark data.
  # They use continue-on-error since benchmark infrastructure may vary.
  # ============================================
  benchmark-lexer:
    name: Benchmark Lexer
    runs-on: ubuntu-latest
    continue-on-error: true  # Individual benchmarks are informational, don't block CI
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run lexer benchmarks
        run: cargo bench --bench lexer -- --verbose || echo "Lexer benchmark completed"
      - name: Upload results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-lexer
          path: target/criterion/lexer/
          if-no-files-found: ignore

  benchmark-parser:
    name: Benchmark Parser
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run parser benchmarks
        run: cargo bench --bench parser -- --verbose || echo "Parser benchmark completed"
      - name: Upload results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-parser
          path: target/criterion/parser/
          if-no-files-found: ignore

  benchmark-semantic:
    name: Benchmark Semantic
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run semantic benchmarks
        run: cargo bench --bench semantic -- --verbose || echo "Semantic benchmark completed"
      - name: Upload results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-semantic
          path: target/criterion/semantic/
          if-no-files-found: ignore

  benchmark-ir:
    name: Benchmark IR Generation
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run IR benchmarks
        run: cargo bench --bench ir_generation -- --verbose || echo "IR benchmark completed"
      - name: Upload results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-ir
          path: target/criterion/ir_generation/
          if-no-files-found: ignore

  benchmark-optimizer:
    name: Benchmark Optimizer
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run optimizer benchmarks
        run: cargo bench --bench optimizer -- --verbose || echo "Optimizer benchmark completed"
      - name: Upload results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-optimizer
          path: target/criterion/optimizer/
          if-no-files-found: ignore

  benchmark-e2e:
    name: Benchmark End-to-End
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run end-to-end benchmarks
        run: cargo bench --bench end_to_end -- --verbose || echo "E2E benchmark completed"
      - name: Upload results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-e2e
          path: target/criterion/end_to_end/
          if-no-files-found: ignore

  benchmark-jit:
    name: Benchmark JIT Compilation
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run JIT benchmarks
        run: cargo bench --features jit --bench jit -- --verbose || echo "JIT benchmark completed"
      - name: Upload results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-jit
          path: target/criterion/jit*/
          if-no-files-found: ignore
